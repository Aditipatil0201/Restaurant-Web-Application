<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login and Signup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" />
    <style>
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 100%; max-width: 500px; }
        .auth-tabs { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .auth-tabs button { border: none; background: none; font-weight: bold; font-size: 18px; cursor: pointer; padding-bottom: 5px; }
        .auth-tabs button.active { border-bottom: 2px solid #007bff; color: #007bff; }
        .form-group { margin-bottom: 1.5rem; }
        .btn-primary { width: 100%; }
        .alert { margin-top: 15px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-tabs">
            <button id="login-tab" class="active" onclick="switchTab('login')">Login</button>
            <button id="signup-tab" onclick="switchTab('signup')">Signup</button>
        </div>
        <div id="login-form">
            <h3 class="text-center">Login</h3>
            <div class="alert alert-info">
              Default login: <strong>admin / admin123</strong>. Or use signup to create a new account.
            </div>
            <form id="loginForm">
                <div class="form-group"><label for="username">Username</label><input type="text" id="username" name="username" class="form-control" required /></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" class="form-control" required /></div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div id="login-error" class="alert alert-danger" style="display:none"></div>
        </div>
        <div id="signup-form" style="display: none;">
            <h3 class="text-center">Signup</h3>
            <form id="signupForm">
                <div class="form-group"><label for="new-username">Username</label><input type="text" id="new-username" name="username" class="form-control" required /></div>
                <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" class="form-control" required /></div>
                <div class="form-group"><label for="new-password">Password</label><input type="password" id="new-password" name="password" class="form-control" required /></div>
                <div class="form-group"><label for="confirm-password">Confirm Password</label><input type="password" id="confirm-password" name="confirm_password" class="form-control" required /></div>
                <button type="submit" class="btn btn-primary">Signup</button>
            </form>
            <div id="signup-error" class="alert alert-danger" style="display:none"></div>
            <div id="signup-success" class="alert alert-success" style="display:none"></div>
        </div>
    </div>
    <script>
        function switchTab(tab) {
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.style.display = 'none';
            const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
            const result = await response.json();
            if (response.ok) {
                window.location.href = '/';
            } else {
                errorEl.textContent = result.error || 'Login failed';
                errorEl.style.display = 'block';
            }
        });
        document.getElementById('signupForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('new-username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('signup-error');
            const successEl = document.getElementById('signup-success');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            if (password !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }
            const response = await fetch('/api/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password }) });
            const result = await response.json();
            if (response.ok) {
                successEl.textContent = 'Signup complete, redirecting to login...';
                successEl.style.display = 'block';
                setTimeout(() => window.location.href = '/login', 1500);
            } else {
                errorEl.textContent = result.error || 'Signup failed';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
